name: Bien dich ung dung iOS .IPA
on:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Kiem tra ma nguon
        uses: actions/checkout@v4

      - name: Thiet lap Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cai dat moi truong va thu vien Expo
        run: |
          npm install

      - name: Dong goi ung dung web-build layout
        run: |
          npx expo export --platform ios

      - name: Xuat file IPA giao dien len GitHub
        uses: actions/upload-artifact@v4
        with:
          name: DeltaDashboard-Layout
          path: dist/